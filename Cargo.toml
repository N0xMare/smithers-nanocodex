[package]
name = "smithers-nanocodex"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
description = "One-shot Nanocodex bridge for Smithers workflow agents"
license = "MIT"
repository = "https://github.com/N0xMare/smithers-nanocodex"
readme = "README.md"
build = "build.rs"
publish = false

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
nanocodex = "=0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower = "0.5"

[dev-dependencies]
base64 = "0.22"
jsonschema = { version = "=0.49.2", default-features = false }
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = "symbols"
